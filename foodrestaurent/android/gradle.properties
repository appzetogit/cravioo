org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix for cross-drive Kotlin incremental compilation error on Windows
# (pub cache on C: drive, project on D: drive)
kotlin.incremental=false

# Bypass strict JVM target consistency checks
kotlin.jvm.target.validation.mode=warning